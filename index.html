  <!-- scenic backdrop: dusk over the hills, seen through a tall window -->
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3b4766" />

          <stop offset=".72" stop-color="#e9b383" />
          <stop offset="1" stop-color="#4b3a33" />
        </linearGradient>
        <radialGradient id="sun" cx=".5" cy=".66" r=".45">
          <stop offset="0" stop-color="#ffd8a0" stop-opacity=".95" />
          <stop offset=".25" stop-color="#ffbd85" stop-opacity=".5" />
          <stop offset="1" stop-color="#ffbd85" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2e2520" />
          <stop offset="1" stop-color="#14100e" />
        </linearGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="14" /></filter>
        <filter id="softer"><feGaussianBlur stdDeviation="5" /></filter>
      </defs>
      <rect width="1600" height="1000" fill="url(#sky)" />
      <rect width="1600" height="1000" fill="url(#sun)" />
      <g filter="url(#soft)" opacity=".5">
        <ellipse cx="300" cy="230" rx="260" ry="40" fill="#a7a3b6" />

      <rect y="780" width="1600" height="220" fill="url(#floor)" />

      <g fill="#120f0d">
        <rect x="0" y="0" width="1600" height="26" />
        <rect x="0" y="770" width="1600" height="16" />
        <rect x="0" y="0" width="34" height="790" />
        <rect x="1566" y="0" width="34" height="790" />

        <rect x="1204" y="0" width="16" height="790" />

        <rect x="160" y="800" width="380" height="50" rx="22" />

    </svg>
  </div>

  <!-- top bar -->
  <header class="top" id="top">
    <div class="top-l">
      <button class="glass-ic" type="button" data-go="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h16"/></svg></button>
      <a href="#home" class="who" data-go="home" translate="no"><span class="avatar">AE</span><span class="who-t"><b>Abdelkader El Azzouzi</b><small data-k="roleShort"></small></span></a>
    </div>
    <nav class="pills" id="pills" aria-label="Main"></nav>
    <div class="top-r">
      <div class="lang" id="lang"></div>
      <a class="glass-ic" href="mailto:abdelkader.elazzouzi@gmail.com" aria-label="Email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg></a>
      <a class="glass-ic" href="https://www.linkedin.com/in/abdelkader-el-azzouzi-7778a5189" target="_blank" rel="noopener" aria-label="LinkedIn" data-icon="linkedin"></a>
      <span class="avatar sm status" aria-hidden="true">AE</span>
    </div>
  </header>

  <!-- dock -->
  <nav class="dock" id="dock" aria-label="Screens"></nav>

  <main id="main" class="screens">
    <!-- HOME -->
    <section class="view" data-view="home" id="v-home">
      <header class="vh">
        <div>
          <h1 class="vh-t" id="greet"></h1>
          <p class="vh-s" data-kh="heroTitle"></p>
        </div>
        <div class="vh-a">
          <a class="gbtn primary" href="#projects" data-go="projects" data-k="ctaWork"></a>
          <a class="gbtn" href="#contact" data-go="contact" data-k="ctaContact"></a>
        </div>
      </header>
      <div class="kpis" id="stats"></div>
      <div class="row r2">
        <article class="g card flow-card">
          <div class="ch"><h2 data-k="liveTitle"></h2><span class="live-pill"><i></i><span data-k="liveTag"></span></span></div>
          <p class="cs" data-k="liveSub"></p>
          <div class="flow-box"><canvas id="hero-flow" aria-label="Data flowing from business systems through an integration hub to apps and AI agents"></canvas></div>
        </article>
        <article class="g card now-card">
          <div class="ch"><h2 data-k="nowTitle"></h2></div>
          <p class="cs" id="now-date"></p>
          <ul class="now" id="now"></ul>
        </article>
      </div>
      <div class="row r3">
        <article class="g card jobs-card">
          <div class="ch"><h2 data-k="jobsTitle"></h2><span class="tag-pill" data-k="jobsTag"></span></div>
          <p class="cs" data-k="jobsSub"></p>
          <div class="vbars" id="vbars"></div>
        </article>
        <article class="g card plain-card">
          <div class="ch"><h2 data-k="doTitle"></h2><div class="seg" role="tablist" id="compare-seg"></div></div>
          <div class="compare-stage"><svg id="compare-svg" viewBox="0 0 640 340" role="img"></svg></div>
          <p class="compare-cap" id="compare-cap" aria-live="polite"></p>
        </article>
      </div>
      <div class="pillars" id="pillars"></div>
      <article class="g card team">
        <div class="ch"><h2 data-k="teamTitle"></h2><div class="seg seg-wrap" role="tablist" id="team-seg"></div></div>
        <div class="team-board" id="team-board"></div>
      </article>
    </section>

    <!-- EXPERTISE -->
    <section class="view" data-view="expertise" id="v-expertise" hidden>
      <header class="vh">
        <div><h1 class="vh-t" data-k="exTitle"></h1><p class="vh-s" data-k="exLede"></p></div>
        <div class="xtabs seg" role="tablist" id="xtabs"></div>
      </header>
      <div class="xpanel" id="xpanel"></div>
    </section>

    <!-- PROJECTS -->
    <section class="view" data-view="projects" id="v-projects" hidden>
      <header class="vh">
        <div><h1 class="vh-t" data-k="workTitle"></h1><p class="vh-s" data-k="workLede"></p></div>
        <div class="filters seg" role="tablist" id="filters"></div>
      </header>
      <ul class="tiles" id="works"></ul>
    </section>

    <!-- CAREER -->
    <section class="view" data-view="career" id="v-career" hidden>
      <header class="vh">
        <div><h1 class="vh-t" data-k="xpTitle"></h1><p class="vh-s" data-k="careerSub"></p></div>
      </header>
      <div class="career">
        <article class="g card"><ol class="cv" id="cv"></ol></article>
        <div class="career-side">
          <article class="g card"><div class="ch"><h2 data-k="eduTitle"></h2></div><ul class="plain-list" id="edu"></ul></article>
          <article class="g card"><div class="ch"><h2 data-k="langTitle"></h2></div><ul class="plain-list" id="langs"></ul></article>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="view" data-view="contact" id="v-contact" hidden>
      <header class="vh">
        <div><h1 class="vh-t" data-k="msgTitle"></h1><p class="vh-s" data-k="ctLede"></p></div>
      </header>
      <div class="msg-app">
        <aside class="g card msg-list" id="msg-list"></aside>
        <article class="g card msg-thread">
          <div class="mt-head" id="mt-head"></div>
          <div class="mt-body" id="mt-body" aria-live="polite"></div>
          <form class="mt-compose" id="mt-compose">
            <input id="mt-input" type="text" autocomplete="off" />
            <button class="gbtn primary" type="submit" id="mt-send"></button>
          </form>
        </article>
        <aside class="g card msg-profile" id="msg-profile"></aside>
      </div>
      <footer class="foot"><span>© 2026 Abdelkader El Azzouzi</span><span data-k="footer"></span></footer>
    </section>
  </main>

  <!-- project sheet -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer-bg" data-close></div>
    <article class="drawer-card g" role="dialog" aria-modal="true" aria-labelledby="dr-title" tabindex="-1">
      <button class="x" type="button" data-close aria-label="Close">×</button>
      <div id="drawer-body"></div>
    </article>
  </div>

  <div class="tip" id="tip" role="tooltip" hidden><b id="tip-t"></b><p id="tip-what"></p><p class="tip-where"><span id="tip-wl"></span><em id="tip-where"></em></p></div>

  <script type="module" src="js/app.js"></script>
