      <div class="hero-txt">

      </div>
      <article class="card graph-card rv">
        <div class="ch-row"><h3 class="ch" data-k="graphTitle"></h3><div class="seg graph-seg" role="tablist" id="graph-seg"></div></div>

      <a class="next" href="#expertise" data-next="expertise"></a>
