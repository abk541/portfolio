<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Abdelkader El Azzouzi · Integration & AI Tech Lead</title>
  <meta name="description" content="Tech Lead MuleSoft & Informatica IDMC at Bouygues Construction IT. 120+ APIs in production, a group-wide master-data platform and 30 MCP servers for AI agents. AI-enhanced full-stack developer since 2023." />
  <meta property="og:title" content="Abdelkader El Azzouzi · Integration & AI Tech Lead" />
  <meta property="og:description" content="I connect the software a company runs on, and make AI useful on top of it." />
  <meta name="theme-color" content="#f4f1ea" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141414'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23f4f1ea' text-anchor='middle'%3EAE%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="top" id="top">
    <div class="wrap top-in">
      <a href="#hero" class="mark" aria-label="Abdelkader El Azzouzi, home" translate="no"><span class="mono">AE</span><span class="mark-name">Abdelkader El Azzouzi</span></a>
      <nav class="links" aria-label="Main">
        <a href="#work" data-k="navWork"></a>
        <a href="#expertise" data-k="navExpertise"></a>
        <a href="#experience" data-k="navExperience"></a>
        <a href="#contact" data-k="navContact"></a>
      </nav>
      <div class="lang" id="lang"></div>
      <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="sheet"><span></span><span></span></button>
    </div>
    <span class="progress" aria-hidden="true"><i id="progress"></i></span>
  </header>

  <div class="sheet" id="sheet" hidden>
    <nav aria-label="Mobile">
      <a href="#work" data-k="navWork"></a>
      <a href="#expertise" data-k="navExpertise"></a>
      <a href="#experience" data-k="navExperience"></a>
      <a href="#contact" data-k="navContact"></a>
    </nav>
  </div>

  <main id="main">
    <!-- HERO -->
    <section class="hero" id="hero">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <p class="eyebrow r" data-k="heroEyebrow"></p>
          <h1 class="hero-title r" data-kh="heroTitle"></h1>
          <p class="hero-sub r" data-k="heroSub"></p>
          <div class="cta r">
            <a href="#work" class="btn solid" data-k="ctaWork"></a>
            <a href="#contact" class="btn line" data-k="ctaContact"></a>
          </div>
        </div>
        <figure class="hero-art r" aria-hidden="true"><svg id="hub" viewBox="0 0 420 420"></svg></figure>
      </div>
      <div class="wrap">
        <dl class="stats" id="stats"></dl>
      </div>
    </section>

    <!-- WHAT I DO -->
    <section class="sec" id="what">
      <div class="wrap">
        <header class="sec-head">
          <p class="eyebrow r" data-k="doEyebrow"></p>
          <h2 class="r" data-k="doTitle"></h2>
          <p class="lede r" data-k="doLede"></p>
        </header>
        <div class="compare r">
          <div class="seg" role="tablist" id="compare-seg"></div>
          <div class="compare-stage"><svg id="compare-svg" viewBox="0 0 640 340" role="img"></svg></div>
          <p class="compare-cap" id="compare-cap" aria-live="polite"></p>
        </div>
        <div class="pillars" id="pillars"></div>
        <div class="team r">
          <h3 data-k="teamTitle"></h3>
          <div class="seg seg-wrap" role="tablist" id="team-seg"></div>
          <div class="team-board" id="team-board"></div>
        </div>
      </div>
    </section>

    <!-- EXPERTISE -->
    <section class="sec alt" id="expertise">
      <div class="wrap">
        <header class="sec-head">
          <p class="eyebrow r" data-k="exEyebrow"></p>
          <h2 class="r" data-k="exTitle"></h2>
          <p class="lede r" data-k="exLede"></p>
        </header>
        <div class="xtabs r" role="tablist" id="xtabs"></div>
        <div class="xpanel" id="xpanel"></div>
      </div>
    </section>

    <!-- WORK -->
    <section class="sec" id="work">
      <div class="wrap">
        <header class="sec-head">
          <p class="eyebrow r" data-k="workEyebrow"></p>
          <h2 class="r" data-k="workTitle"></h2>
          <p class="lede r" data-k="workLede"></p>
        </header>
        <div class="filters r" role="tablist" id="filters"></div>
        <ul class="works" id="works"></ul>
      </div>
    </section>

    <!-- EXPERIENCE -->
    <section class="sec alt" id="experience">
      <div class="wrap">
        <header class="sec-head">
          <p class="eyebrow r" data-k="xpEyebrow"></p>
          <h2 class="r" data-k="xpTitle"></h2>
        </header>
        <ol class="cv" id="cv"></ol>
        <div class="cv-side">
          <div class="r"><h3 data-k="eduTitle"></h3><ul class="plain-list" id="edu"></ul></div>
          <div class="r"><h3 data-k="langTitle"></h3><ul class="plain-list" id="langs"></ul></div>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="sec contact" id="contact">
      <div class="wrap">
        <p class="eyebrow r" data-k="ctEyebrow"></p>
        <h2 class="contact-title r" data-k="ctTitle"></h2>
        <p class="lede r" data-k="ctLede"></p>
        <div class="contact-row r">
          <a class="btn solid big" href="mailto:abdelkader.elazzouzi@gmail.com"><span data-k="email"></span> <span class="arrow">→</span></a>
          <a class="social" href="https://www.linkedin.com/in/abdelkader-el-azzouzi-7778a5189" target="_blank" rel="noopener" data-icon="linkedin">LinkedIn</a>
          <a class="social" href="https://github.com/abk541" target="_blank" rel="noopener" data-icon="github">GitHub</a>
        </div>
      </div>
      <footer class="wrap foot">
        <span>© 2026 Abdelkader El Azzouzi</span>
        <span data-k="footer"></span>
      </footer>
    </section>
  </main>

  <!-- project drawer -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer-bg" data-close></div>
    <article class="drawer-card" role="dialog" aria-modal="true" aria-labelledby="dr-title" tabindex="-1">
      <button class="x" type="button" data-close aria-label="Close">×</button>
      <div id="drawer-body"></div>
    </article>
  </div>

  <!-- skill popover -->
  <div class="tip" id="tip" role="tooltip" hidden><b id="tip-t"></b><p id="tip-what"></p><p class="tip-where"><span id="tip-wl"></span><em id="tip-where"></em></p></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
